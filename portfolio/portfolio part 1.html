<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Susan's Bar & Kitchen</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto Slab', serif;
            background-color: #d4ccc0;
        }

        .navigation {
            background-color: #2c1914;
            padding: 20px 8%;
        }

        .logo {
            color: #f5bb0e;
            font-size: 25px;
            font-weight: 900;
        }

        .navigation-link {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .navigation-link:hover {
            color: #daac1f;
            text-decoration: none;
        }

        .book-btn {
            background-color: #ebb40f;
            color: #2a1713;
            padding: 10px 18px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        .book-btn:hover {
            background-color: white;
            color: #522f28;
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .navigation {
                padding: 20px;
            }

            .navigation .row {
                row-gap: 20px;
            }

            .navigation-link {
                font-size: 12px;
            }

            .banner {
                flex-direction: column;
                text-align: center;
                padding: 50px 20px;
            }

            .banner-text h1 {
                font-size: 36px;
            }

            .banner-image {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <nav class="container-fluid navigation">
        <div class="row align-items-center">

            <div class="col-md-4 col-12 text-center text-md-left">
                <div class="logo">Susan's Bar and resteraunt</div>
            </div>

            <div class="col-md-8 col-12 mt-3 mt-md-0">
                <div class="d-flex justify-content-center
                justify-content-md-end align-items-center flex-wrap">

                    <a href="#home" class="navigation-link mx-2 mx-md-3">Home</a>
                    <a href="#menu" class="navigation-link mx-2 mx-md-3">Menu</a>
                    <a href="#about" class="navigation-link mx-2 mx-md-3">About</a>
                    <a href="#contact" class="navigation-link mx-2 mx-md-3">Contact</a>
                    <a href="#contact" class="book-btn ml-2 mt-2 mt-md-0">
                        Book a Table
                    </a>

                </div>
            </div>

        </div>
    </nav>
    <!-- MENU BANNER -->
    <section class="menu-banner" id="home">
        <div class="menu-overlay">
            <div class="menu-content">
                <p class="menu-subtitle">WELCOME TO SUSAN'S</p>
    
                <h1>Good Food.<br>
                    Great Drinks.<br>
                    <span>Good Times.</span>
                </h1>
    
                <p class="menu-description">
                    Enjoy delicious meals, refreshing drinks, and
                    unforgettable moments at Susan's Bar & Kitchen.
                </p>
    
                <div class="menu-buttons">
                    <a href="#menu" class="menu-btn">Explore Our Menu</a>
                    <a href="#contact" class="menu-btn-outline">
                        Book a Table
                    </a>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
